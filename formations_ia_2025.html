        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;

            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.8em;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .subtitle {
            color: #666;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 15px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .stat-number {
            font-size: 2.5em;
            display: block;
            font-weight: 900;
        }

        .filters {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .filter-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group label {
            font-weight: 600;
            color: #667eea;
        }

        .filter-group select, .filter-group input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            flex: 1;
            min-width: 200px;
        }

        .session-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            border-left: 5px solid #667eea;
        }

        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
            gap: 20px;
        }

        .session-title {
            color: #1a1a1a;
            font-size: 1.5em;
            font-weight: 700;
            flex: 1;
        }

        .session-date {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap;
            text-align: center;
            min-width: 140px;
        }

        .session-date .day {
            font-size: 1.8em;
            display: block;
            line-height: 1;
        }

        .session-date .month {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .session-info {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .info-badge {
            background: #f5f5f5;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.95em;
            color: #555;
            font-weight: 600;
        }

        .info-badge.time {
            background: #e3f2fd;
            color: #1976d2;
        }

        .info-badge.duration {
            background: #fff3e0;
            color: #f57c00;
        }

        .info-badge.deadline {
            background: #ffebee;
            color: #c62828;
        }

        .info-badge.deadline.urgent {
            background: #c62828;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .session-theme {
            color: #555;
            font-size: 1.05em;
            margin: 15px 0;
            line-height: 1.8;
        }

        .btn-inscription {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            font-size: 1.05em;
        }

        .btn-inscription:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .month-separator {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 40px 0 25px 0;
            text-align: center;
            font-size: 1.8em;
            font-weight: 800;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .no-results {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            color: #999;
        }

        .no-results svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .session-header { flex-direction: column; }
            .session-date { width: 100%; }
            .filter-group { flex-direction: column; align-items: stretch; }
        }
    </style>

        function filterSessions() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const periodValue = document.getElementById('periodFilter').value;
            const container = document.getElementById('sessionsContainer');

            let filtered = sessions.filter(s => {
                const matchesSearch = s.theme.toLowerCase().includes(searchValue);
                let matchesPeriod = true;

                if (periodValue === 'trimestre1') {
                    matchesPeriod = s.dateObj.getMonth() >= 10 || s.dateObj.getMonth() === 11;
                } else if (periodValue === 'novembre') {
                    matchesPeriod = s.dateObj.getMonth() === 10;
                } else if (periodValue === 'decembre') {
                    matchesPeriod = s.dateObj.getMonth() === 11;
                } else if (periodValue === 'trimestre2') {
                    matchesPeriod = s.dateObj.getMonth() >= 0 && s.dateObj.getMonth() <= 2 && s.dateObj.getFullYear() === 2026;
                }

                return matchesSearch && matchesPeriod;
            });

            if (filtered.length === 0) {
                container.innerHTML = '<div class="no-results"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><h2>Aucune formation trouvée</h2><p>Modifiez vos critères de recherche</p></div>';
                return;
            }

            let html = '';
            let currentMonth = null;
            const today = new Date();

            filtered.forEach(s => {
                const month = s.dateObj.getMonth();

                if (month !== currentMonth) {
                    html += `<div class="month-separator">📅 ${monthNames[month]}</div>`;
                    currentMonth = month;
                }

                const dateStr = s.date.split('-');
                const dayNum = dateStr[0];
                const monthStr = dateStr[1];

                const daysUntilDeadline = Math.ceil((s.deadlineObj - today) / (1000 * 60 * 60 * 24));
                const deadlineClass = daysUntilDeadline <= 7 ? 'deadline urgent' : 'deadline';

                html += `
                    <div class="session-card">
                        <div class="session-header">
                            <div class="session-title">${s.theme}</div>
                            <div class="session-date">
                                <span class="day">${dayNum}</span>
                                <span class="month">${monthStr}</span>
                            </div>
                        </div>
                        <div class="session-info">
                            <span class="info-badge time">🕐 ${s.heure}</span>
                            <span class="info-badge duration">⏱️ ${s.duree}</span>
                            <span class="info-badge ${deadlineClass}">⏰ Inscription avant le ${s.deadline}</span>
                        </div>
                        <div style="margin-top: 20px;">
                            <a href="${s.link}" target="_blank" class="btn-inscription">
                                ✅ Me préinscrire sur Sofia-FMO
                            </a>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

            margin: 0 auto;
            position: relative;

        }

        }

            left: 4px;

            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        }

        }

        }

            border-bottom: none;
        }

        .formation-header {

            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .formation-header::before {

            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(144, 164, 174, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .formation-header:hover::before {
            left: 100%;
        }

            background: #f8f9fa;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .formation-title {

            font-weight: 600;
            color: #455a64;

            position: relative;
            z-index: 1;

            font-size: 0.8rem;
            margin-right: 1rem;

            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8ba4b0, #90a4ae);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.3s ease;

        .formation-item.active .expand-icon {
            transform: rotate(180deg);
            background: linear-gradient(135deg, #90a4ae, #b0bec5);

        .formation-content {

            overflow: hidden;

            background: #f8f9fa;
        }

        .formation-item.active .formation-content {

                    },
                    {

                        format: "2 présentiels de 6H",
                        dates: "vendredi 19/09/25 et vendredi 07/11/25"
                    },
                    {
                        name: "Formation de formateurs numériques : plan de formation, veille pédagogique, actualités",
                        format: "2 présentiels de 6H",
                        dates: "vendredi 12/12/25 et vendredi 20/03/26"
                    }
                ]
            },
            {
                id: 2,
                title: "Formation PIX - Administrateurs",
                modules: [
                    {
                        name: "Formation des administrateurs PIX des collèges",

                    },
                    {
                        name: "Formation des administrateurs PIX des lycées",
                        format: "1 distanciel de 1,5H",
                        date: "Mercredi 05/11/25"
                    }
                ]
            },
            {
                id: 3,
                title: "ELEA expert",
                modules: [
                    {
                        name: "ELEA expert",
                        format: "2 distanciels de 1,5H + 1 présentiel de 3H",
                        dates: "mercredi 24/09/25, 10/12/25 et mercredi 15/11/25"
                    }
                ]
            },
            {
                id: 4,
                title: "Yes we code - les cartes microbit",
                modules: [
                    {
                        name: "Yes we code - les cartes microbit",
                        format: "2 présentiels de 3H",
                        dates: "mercredi 11/01/25 et mercredi 01/04/26"
                    }
                ]
            },
            {
                id: 5,
                title: "Formation drone - BIMD",
                modules: [
                    {
                        name: "Mise en place du Brevet d'Initiation aux Métiers Du Drone (BIMD)",
                        format: "1 présentiel de 3H + 1 distanciel de 2H",
                        periode: "À déterminer"
                    },
                    {
                        name: "Maîtriser l'usage du drone en établissement scolaire",
                        format: "1 présentiel de 4H + 1 distanciel de 2H",
                        periode: "À déterminer"
                    }
                ]
            }
        ];

        // Variables globales
        let currentType = 'pv';
        let currentFormations = formationsPV;

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            setupEventListeners();
        });

        function initializeApp() {
            renderFormations();
            updateStats();
        }

        function setupEventListeners() {
            // Navigation entre PV et PZ
            const navButtons = document.querySelectorAll('.nav-btn');
            const navSlider = document.querySelector('.nav-slider');
            
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.type;
                    switchFormationType(type);
                    
                    // Animation du slider
                    navButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    if (type === 'pz') {
                        navSlider.classList.add('moved');
                    } else {
                        navSlider.classList.remove('moved');
                    }
                });
            });

            // Recherche
            const searchInput = document.querySelector('.search-input');
            searchInput.addEventListener('input', (e) => {
                filterFormations(e.target.value);
            });
        }

        function switchFormationType(type) {
            currentType = type;
            currentFormations = type === 'pv' ? formationsPV : formationsPZ;
            
            // Cacher/afficher les conteneurs
            document.getElementById('formations-pv').classList.toggle('hidden', type !== 'pv');
            document.getElementById('formations-pz').classList.toggle('hidden', type !== 'pz');
            
            renderFormations();
            updateStats();
        }

        function renderFormations() {
            const container = document.getElementById(`formations-${currentType}`);
            container.innerHTML = '';

            currentFormations.forEach(formation => {
                const formationElement = createFormationElement(formation);
                container.appendChild(formationElement);
            });
        }

        function createFormationElement(formation) {
            const section = document.createElement('div');
            section.className = 'formation-section';
            section.innerHTML = `
                <div class="section-header">
                    <h2>${formation.title}</h2>
                    <div class="count">${formation.modules.length} module(s)</div>
                </div>
            `;

            formation.modules.forEach((module, index) => {
                const moduleElement = createModuleElement(module, index + 1, formation.id);
                section.appendChild(moduleElement);
            });

            return section;
        }

        function createModuleElement(module, moduleNumber, formationId) {
            const moduleDiv = document.createElement('div');
            moduleDiv.className = 'formation-item';
            moduleDiv.innerHTML = `
                <div class="formation-header" onclick="toggleModule(this)">
                    <div class="formation-number">${moduleNumber}</div>
                    <div class="formation-title">${module.name}</div>
                    <div class="expand-icon">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M7,10L12,15L17,10H7Z"/>
                        </svg>
                    </div>
                </div>
                <div class="formation-content">
                    <div class="formation-details">
                        ${createModuleDetails(module)}
                    </div>
                </div>
            `;
            return moduleDiv;
        }

        function createModuleDetails(module) {
            let details = '';

            // Format/Durée
            if (module.format) {
                const badges = extractBadges(module.format);
                details += `
                    <div class="detail-card">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"/>
                            </svg>
                            Format
                        </div>
                        <div class="detail-value">${badges}</div>
                    </div>
                `;
            }

            // Plateforme
            if (module.plateforme) {
                details += `
                    <div class="detail-card">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M4,6H20V16H4M20,18A2,2 0 0,0 22,16V6C22,4.89 21.1,4 20,4H4C2.89,4 2,4.89 2,6V16A2,2 0 0,0 4,18H0V20H24V18H20Z"/>
                            </svg>
                            Plateforme
                        </div>
                        <div class="detail-value">
                            <span class="badge magistere">${module.plateforme}</span>
                        </div>
                    </div>
                `;
            }

            // Date(s)
            const dateInfo = getDateInfo(module);
            if (dateInfo) {
                details += `
                    <div class="detail-card">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M19,19H5V8H19M16,1V3H8V1H6V3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,4.89 20.1,4 19,4H18V2M17,12H12V17H17V12Z"/>
                            </svg>
                            Dates
                        </div>
                        <div class="detail-value">${dateInfo}</div>
                    </div>
                `;
            }

            // Groupes/Public
            if (module.groupes) {
                details += `
                    <div class="detail-card">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M16,4C18.22,4 20,5.78 20,8C20,10.22 18.22,12 16,12C13.78,12 12,10.22 12,8C12,5.78 13.78,4 16,4M16,14C18.67,14 24,15.33 24,18V20H8V18C8,15.33 13.33,14 16,14M8,4C10.22,4 12,5.78 12,8C12,10.22 10.22,12 8,12C5.78,12 4,10.22 4,8C4,5.78 5.78,4 8,4M8,14C10.67,14 16,15.33 16,18V20H0V18C0,15.33 5.33,14 8,14Z"/>
                            </svg>
                            Public cible
                        </div>
                        <div class="detail-value">${module.groupes}</div>
                    </div>
                `;
            }

            // Lieu(x)
            if (module.lieux) {
                details += `
                    <div class="detail-card">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M12,11.5A2.5,2.5 0 0,1 9.5,9A2.5,2.5 0 0,1 12,6.5A2.5,2.5 0 0,1 14.5,9A2.5,2.5 0 0,1 12,11.5M12,2A7,7 0 0,0 5,9C5,14.25 12,22 12,22C12,22 19,14.25 19,9A7,7 0 0,0 12,2Z"/>
                            </svg>
                            Lieux
                        </div>
                        <div class="detail-value">${module.lieux}</div>
                    </div>
                `;
            }

            // Ateliers spéciaux
            if (module.ateliers) {
                details += `
                    <div class="detail-card" style="grid-column: 1 / -1;">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z"/>
                            </svg>
                            Ateliers disponibles
                        </div>
                        <div class="detail-value">
                            <ul style="margin: 0.5rem 0; padding-left: 1rem;">
                                ${module.ateliers.map(atelier => `<li>${atelier}</li>`).join('')}
                            </ul>
                            ${module.planning ? `<strong>Planning :</strong> ${module.planning}` : ''}
                        </div>
                    </div>
                `;
            }

            // Notes spéciales
            if (module.note) {
                details += `
                    <div class="detail-card" style="grid-column: 1 / -1; border-left-color: #8ba4b0;">
                        <div class="detail-label">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/>
                            </svg>
                            Information
                        </div>
                        <div class="detail-value">${module.note}</div>
                    </div>
                `;
            }

            return details;
        }

        function extractBadges(format) {
            let badges = '';
            
            // Détection du type (distanciel/présentiel)
            if (format.includes('distanciel')) {
                badges += '<span class="badge distanciel">Distanciel</span>';
            }
            if (format.includes('présentiel')) {
                badges += '<span class="badge presentiel">Présentiel</span>';
            }
            
            badges += `<span style="margin-left: 0.5rem;">${format}</span>`;
            return badges;
        }

        function getDateInfo(module) {
            if (module.date) return module.date;
            if (module.dates) return module.dates;
            if (module.periode) return module.periode;
            return null;
        }

        function toggleModule(headerElement) {
            const moduleItem = headerElement.parentElement;
            moduleItem.classList.toggle('active');
        }

        function filterFormations(searchTerm) {
            const formationItems = document.querySelectorAll('.formation-item');
            const formationSections = document.querySelectorAll('.formation-section');
            
            formationItems.forEach(item => {
                const title = item.querySelector('.formation-title').textContent.toLowerCase();
                const isVisible = title.includes(searchTerm.toLowerCase());
                item.style.display = isVisible ? 'block' : 'none';
            });

            // Cacher les sections qui n'ont aucun module visible
            formationSections.forEach(section => {
                const visibleModules = section.querySelectorAll('.formation-item[style="display: block"], .formation-item:not([style*="display: none"])');
                section.style.display = visibleModules.length > 0 ? 'block' : 'none';
            });
        }

        function updateStats() {
            const totalFormations = currentFormations.length;
            const totalModules = currentFormations.reduce((sum, formation) => sum + formation.modules.length, 0);

            document.getElementById('total-formations').textContent = totalFormations;
            document.getElementById('total-modules').textContent = totalModules;
        }
    </script>
</body>

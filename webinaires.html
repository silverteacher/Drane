<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monter en compétences DRANE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.8em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .period-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            margin-top: 15px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: #f8f9fa;
            padding: 25px 40px;
            border-radius: 12px;
            border-left: 5px solid #667eea;
            transition: transform 0.3s;
            min-width: 200px;
        }

        .stat-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .stat-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            line-height: 1;
        }

        .stat-label {
            color: #666;
            font-size: 1em;
            margin-top: 10px;
        }

        .filter-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .filter-section h3 {
            color: #2c3e50;
            font-size: 1.3em;
            margin-bottom: 20px;
        }

        .filter-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 14px 28px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 1em;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }

        .filter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .formation-card {
            background: white;
            border-radius: 15px;
            padding: 35px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .formation-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .urgency-badge {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .urgent {
            background: #ff4757;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .soon {
            background: #ffa502;
            color: white;
        }

        .normal {
            background: #2ed573;
            color: white;
        }

        .session-name {
            font-size: 1.8em;
            color: #2c3e50;
            margin-bottom: 20px;
            font-weight: 600;
            padding-right: 150px;
            line-height: 1.3;
        }

        .theme-description {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .info-label {
            color: #666;
            font-size: 1em;
            font-weight: 500;
        }

        .info-value {
            color: #2c3e50;
            font-weight: 600;
            font-size: 1.05em;
        }

        .date-highlight {
            color: #667eea;
            font-weight: bold;
        }

        .btn-inscript {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white !important;
            padding: 16px 40px;
            border-radius: 35px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1.1em;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-inscript:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
            color: white !important;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }

            .urgency-badge {
                position: static;
                display: inline-block;
                margin-bottom: 15px;
            }

            .session-name {
                padding-right: 0;
                font-size: 1.4em;
            }

            .stats {
                gap: 20px;
            }

            .stat-box {
                min-width: 150px;
                padding: 20px 30px;
            }

            .stat-number {
                font-size: 2.5em;
            }
        }
    </style>
</head>

        function parseDate(dateStr) {
            const [day, month] = dateStr.split('-');
            const monthMap = {
                'oct': { month: 9, year: 2025 },
                'nov': { month: 10, year: 2025 },
                'déc': { month: 11, year: 2025 },
                'janv': { month: 0, year: 2026 },
                'févr': { month: 1, year: 2026 },
                'mars': { month: 2, year: 2026 }
            };
            const dateInfo = monthMap[month];
            return new Date(dateInfo.year, dateInfo.month, parseInt(day));
        }

        function getUrgencyLevel(dateLimite) {
            const today = new Date(2025, 9, 8);
            const deadline = parseDate(dateLimite);
            const daysLeft = Math.floor((deadline - today) / (1000 * 60 * 60 * 24));
            
            if (daysLeft < 0) return { level: 'expired', label: 'EXPIRÉ', class: 'urgent' };
            if (daysLeft <= 7) return { level: 'urgent', label: 'URGENT', class: 'urgent' };
            if (daysLeft <= 21) return { level: 'soon', label: 'BIENTÔT', class: 'soon' };
            return { level: 'normal', label: 'NORMAL', class: 'normal' };
        }

        function renderFormations(filter = 'all') {
            const container = document.getElementById('formations-list');
            
            let filtered = formations
                .map(f => ({
                    ...f,
                    urgency: getUrgencyLevel(f.dateLimite),
                    deadlineDate: parseDate(f.dateLimite)
                }))
                .filter(f => f.urgency.level !== 'expired')
                .sort((a, b) => a.deadlineDate - b.deadlineDate);

            if (filter !== 'all') {
                filtered = filtered.filter(f => f.urgency.level === filter);
            }

            document.getElementById('totalFormations').textContent = formations.length;
            document.getElementById('urgentFormations').textContent = 
                formations.filter(f => getUrgencyLevel(f.dateLimite).level === 'urgent').length;

            container.innerHTML = filtered.map(f => {
                const year = f.date.includes('janv') || f.date.includes('févr') || f.date.includes('mars') ? '2026' : '2025';
                const deadlineYear = f.dateLimite.includes('janv') || f.dateLimite.includes('févr') ? '2026' : '2025';
                
                return `
                <div class="formation-card" id="${f.id}" data-urgency="${f.urgency.level}">
                    <div class="urgency-badge ${f.urgency.class}">${f.urgency.label}</div>
                    <div class="session-name">${f.session} : ${f.theme}</div>
                    
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="info-label">📅 Date :</span>
                            <span class="info-value date-highlight">${f.date} ${year} à ${f.heure}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">⏱️ Durée :</span>
                            <span class="info-value">${f.duree}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">⏰ Limite inscription :</span>
                            <span class="info-value date-highlight">${f.dateLimite} ${deadlineYear}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">💻 Modalité :</span>
                            <span class="info-value">Classe virtuelle</span>
                        </div>
                    </div>
                    
                    <a href="${f.lien}" target="_blank" rel="noopener noreferrer" class="btn-inscript">
                        ✍️ Me préinscrire maintenant
                    </a>
                </div>
            `;
            }).join('');
        }

        function filterFormations(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderFormations(type);
        }

        renderFormations();

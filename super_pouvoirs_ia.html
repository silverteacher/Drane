<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission I-A : Décryptez l'IA</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f2f4f8;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      position: relative;
      margin: 1rem;
    }
    h1 {
      text-align: center;
      color: #264653;
    }
    .question {
      margin-top: 1.5rem;
    }
    .question h2 {
      font-size: 1.2rem;
      color: #333;
    }
    .answers label {
      display: block;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    .feedback {
      margin-top: 1rem;
      font-weight: bold;
    }
    button {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background-color: #2a9d8f;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #21867a;
    }
    #mascotte {
      width: 80px;
      position: absolute;
      top: -30px;
      right: -30px;
    }
    .badges {
      margin-top: 1rem;
      font-size: 1.2rem;
    }
    #downloadResults {
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://cdn-icons-png.flaticon.com/512/4712/4712102.png" alt="Mascotte IA" id="mascotte" />
    <h1>Mission I-A : Scanner d'IA</h1>
    <div class="question" id="quiz">
      <h2 id="question-text">Chargement...</h2>
      <div class="answers" id="answers"></div>
      <button onclick="nextQuestion()">Question suivante</button>
      <div class="feedback" id="feedback"></div>
      <div class="badges" id="badges"></div>
      <button id="downloadResults" onclick="downloadResults()">📄 Télécharger ma fiche de résultats</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        text: "Quand vous tapez un message et qu’une correction vous est proposée automatiquement, que se passe-t-il ?",
        options: [
          "Une IA détecte et corrige vos erreurs en apprenant de millions d'exemples",
          "Un humain à distance vous corrige",
          "C’est juste une fonction mathématique sans données"
        ],
        correct: [0],
        explanation: "✅ Une IA de traitement du langage prédit la correction en s'appuyant sur des corpus."
      },
      {
        text: "Quelle(s) situation(s) implique(nt) une IA dans un contexte professionnel ?",
        options: [
          "Une plateforme qui vous propose de réorganiser un planning en fonction des contraintes de chacun",
          "Un outil qui reformule automatiquement vos emails",
          "Un scan de documents papier réalisé avec un photocopieur standard"
        ],
        correct: [0,1],
        explanation: "💡 Les deux premières mobilisent de l'IA pour traiter des données. Le scan classique ne le fait pas."
      },
      {
        text: "Quelle application utilise de l’intelligence artificielle ?",
        options: [
          "Une application de traduction instantanée",
          "Une application de reconnaissance vocale comme Siri ou Google Assistant",
          "Un minuteur classique pour gérer votre temps"
        ],
        correct: [0,1],
        explanation: "✅ Traduction et reconnaissance vocale font appel à des réseaux de neurones."
      }
    ];

    let current = 0;
    let correctAnswers = 0;
    let resultsLog = [];

    function loadQuestion() {
      const q = questions[current];
      document.getElementById("question-text").innerText = q.text;
      const answers = document.getElementById("answers");
      answers.innerHTML = "";
      q.options.forEach((opt, i) => {
        const id = `q${current}_opt${i}`;
        answers.innerHTML += `<label><input type='checkbox' id='${id}' value='${i}' /> ${opt}</label>`;
      });
      document.getElementById("feedback").innerText = "";
    }

    function nextQuestion() {
      const q = questions[current];
      const selected = Array.from(document.querySelectorAll("input[type=checkbox]:checked"))
                            .map(input => parseInt(input.value));
      const correct = q.correct;
      const allCorrect = correct.length === selected.length && correct.every(v => selected.includes(v));

      const feedback = document.getElementById("feedback");
      feedback.innerText = allCorrect ? "Bonne réponse !\n" + q.explanation : "Réponse partiellement incorrecte.\n" + q.explanation;

      if (allCorrect) {
        correctAnswers++;
        document.getElementById("badges").innerHTML += `🏅 Badge débloqué !<br>`;
      }

      resultsLog.push(`Q${current + 1}: ${q.text}\nRéponse correcte: ${allCorrect ? "Oui" : "Non"}\n`);

      current++;
      if (current < questions.length) {
        setTimeout(loadQuestion, 2500);
      } else {
        setTimeout(() => {
          document.getElementById("quiz").innerHTML += `<h2>🎉 Mission accomplie ! Vous avez obtenu ${correctAnswers} / ${questions.length} badges !</h2>`;
          document.getElementById("downloadResults").style.display = "block";
        }, 3000);
      }
    }

    function downloadResults() {
      const blob = new Blob([resultsLog.join("\n")], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "resultats_mission_IA.txt";
      link.click();
    }

    loadQuestion();
  </script>
</body>
</html>

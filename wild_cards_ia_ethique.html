<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirage de Wild Cards – IA & Éthique</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1em;
      color: #333;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 2em;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      animation: fadeIn 0.8s ease-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    h1 {
      font-size: 2.5em;
      margin-bottom: 0.5em;
      background: linear-gradient(45deg, #3f3fff, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }
    
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2em;
      font-size: 1.1em;
    }
    
    #card-container {
      perspective: 1000px;
      margin: 2em 0;
    }
    
    #card {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
      border-radius: 15px;
      padding: 2.5em;
      font-size: 1.1em;
      line-height: 1.6;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    
    #card.flipping {
      transform: rotateY(180deg);
    }
    
    #card.new-card {
      transform: rotateY(0deg);
      box-shadow: 0 12px 35px rgba(102, 126, 234, 0.3);
      border: 2px solid rgba(102, 126, 234, 0.2);
    }
    
    .card-question {
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 1.5em;
      font-size: 1.4em;
      text-align: center;
      padding-bottom: 1em;
      border-bottom: 2px solid rgba(102, 126, 234, 0.2);
    }
    
    .card-dilemma {
      background: rgba(102, 126, 234, 0.1);
      padding: 1.2em;
      border-radius: 10px;
      border-left: 4px solid #667eea;
      margin-bottom: 1.5em;
      font-style: italic;
      color: #4a5568;
    }
    
    .card-guidance {
      background: rgba(118, 75, 162, 0.1);
      padding: 1.2em;
      border-radius: 10px;
      border-left: 4px solid #764ba2;
      font-size: 0.95em;
      margin-bottom: 1.5em;
    }
    
    .guidance-title {
      font-weight: 600;
      color: #764ba2;
      margin-bottom: 0.5em;
    }
    
    .guidance-text {
      color: #5a5a5a;
      line-height: 1.5;
    }
    
    .voting-section {
      background: rgba(255, 255, 255, 0.8);
      padding: 1.5em;
      border-radius: 10px;
      border: 2px solid rgba(102, 126, 234, 0.2);
    }
    
    .voting-title {
      font-weight: 600;
      color: #667eea;
      margin-bottom: 1em;
      text-align: center;
      font-size: 1.1em;
    }
    
    .vote-option {
      display: flex;
      align-items: center;
      margin: 0.8em 0;
      padding: 1em;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 2px solid transparent;
    }
    
    .vote-option:hover {
      background: rgba(102, 126, 234, 0.05);
      border-color: rgba(102, 126, 234, 0.3);
    }
    
    .vote-option.voted {
      border-color: #667eea;
      background: rgba(102, 126, 234, 0.1);
    }
    
    .vote-radio {
      margin-right: 12px;
      transform: scale(1.2);
    }
    
    .vote-content {
      flex: 1;
    }
    
    .vote-text {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 4px;
    }
    
    .vote-desc {
      font-size: 0.9em;
      color: #666;
      font-style: italic;
    }
    
    .vote-count {
      margin-left: 10px;
      background: #667eea;
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      font-weight: 600;
    }
    
    .controls {
      display: flex;
      gap: 1em;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 2em;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 1em 2.5em;
      font-size: 1.1em;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .secondary-btn {
      background: linear-gradient(135deg, #718096 0%, #4a5568 100%);
    }
    
    .secondary-btn:hover {
      box-shadow: 0 8px 25px rgba(113, 128, 150, 0.4);
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      margin-top: 2em;
      padding-top: 2em;
      border-top: 2px solid rgba(102, 126, 234, 0.1);
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-number {
      font-size: 2em;
      font-weight: bold;
      color: #667eea;
      display: block;
    }
    
    .stat-label {
      color: #666;
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .card-history {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 1em;
      padding: 1em;
      background: rgba(0,0,0,0.02);
      border-radius: 10px;
    }
    
    .history-item {
      padding: 0.5em;
      margin: 0.25em 0;
      background: white;
      border-radius: 5px;
      font-size: 0.9em;
      border-left: 3px solid #667eea;
    }
    
    @media (max-width: 768px) {
      .container {
        margin: 1em;
        padding: 1.5em;
      }
      
      h1 {
        font-size: 2em;
      }
      
      #card {

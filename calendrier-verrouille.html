<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de Décembre Numérique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', 'Segoe UI', serif;
            padding: 20px;
            background: linear-gradient(135deg, #f5e6d3 0%, #d4a574 100%);
            color: #333;
        }
        
        .header {
            background: linear-gradient(135deg, #8b3a3a 0%, #c92a2a 100%);
            color: white;
            padding: 50px 40px;
            border-radius: 25px;
            text-align: center;
            margin-bottom: 50px;
            box-shadow: 0 15px 40px rgba(139, 58, 58, 0.4);
            position: relative;
            overflow: hidden;
            border: 5px solid #d4a574;
        }
        
        .header::before {
            content: '❄️ ⭐ ✨ 🎄 ❄️ ⭐ ✨ 🎄 ❄️ ⭐ ✨ 🎄';
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            font-size: 1.5em;
            opacity: 0.3;
            animation: float 20s linear infinite;
        }
        
        @keyframes float {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        
        h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
            font-family: 'Georgia', serif;
            font-weight: bold;
        }
        
        .subtitle {
            font-size: 1.3em;
            color: #ffeaa7;
            font-weight: 500;
            position: relative;
            z-index: 1;
            font-style: italic;
        }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(6, 160px);
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
            justify-content: center;
        }
        
        .card-container {
            perspective: 1000px;
            height: 160px;
            transition: transform 0.3s;
            position: relative;
        }
        
        .card-container:hover:not(.flipped):not(.locked) {
            transform: translateY(-10px) rotate(2deg);
        }
        
        .card-container.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(40%);
        }
        
        .card-container.locked:hover {
            transform: none;
        }
        
        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
            flex-direction: column;
            color: white;
            backdrop-filter: blur(3px);
        }
        
        .card-container.locked .locked-overlay {
            display: flex;
        }
        
        .card-container.today:not(.locked) {
            animation: sparkle 2s infinite alternate;
        }
        
        @keyframes sparkle {
            from { 
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
                transform: scale(1);
            }
            to { 
                box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 215, 0, 0.6);
                transform: scale(1.05);
            }
        }
        
        .locked-icon {
            font-size: 3.5em;
            margin-bottom: 8px;
            animation: shake 2s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        
        .locked-text {
            font-size: 0.9em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .card-container.locked {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(40%);
        }
        
        .card-container.locked:hover {
            transform: none;
        }
        
        .locked-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            flex-direction: column;
            color: white;
            backdrop-filter: blur(3px);
        }
        
        .card-container.locked .locked-overlay {
            display: flex;
        }
        
        .card-container.today:not(.locked) {
            animation: sparkle 2s infinite alternate;
        }
        
        @keyframes sparkle {
            from { 
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
                transform: scale(1);
            }
            to { 
                box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 60px rgba(255, 215, 0, 0.6);
                transform: scale(1.05);
            }
        }
        
        .locked-icon {
            font-size: 3.5em;
            margin-bottom: 8px;
            animation: shake 2s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        
        .locked-text {
            font-size: 0.9em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .data-card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        
        .card-container.flipped .data-card {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .card-front {
            background: linear-gradient(135deg, #A50021 0%, #d63447 100%);
            border: 4px solid #FFD700;
            color: white;
            z-index: 2;
        }
        
        /* Motifs décoratifs variés pour chaque carte */
        .card-front::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            background-repeat: repeat;
            background-size: 30px;
        }
        
        /* Variations de couleurs et motifs - style plus organique */
        .card-container:nth-child(1) .card-front { background: linear-gradient(135deg, #8b1e1e 0%, #c92a2a 100%); border-color: #ffd700; }
        .card-container:nth-child(1) .card-front::before { 
            background-image: radial-gradient(circle, rgba(255,255,255,0.3) 2px, transparent 2px);
        }
        
        .card-container:nth-child(2) .card-front { background: linear-gradient(135deg, #0a5f3f 0%, #0d8058 100%); border-color: #ff6b6b; }
        .card-container:nth-child(2) .card-front::before {
            content: '❄️';
            font-size: 80px;
            opacity: 0.1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-container:nth-child(3) .card-front { background: linear-gradient(135deg, #862e4f 0%, #b8385e 100%); border-color: #90d5ff; }
        .card-container:nth-child(3) .card-front::before {
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 0px, rgba(255,255,255,0.1) 2px, transparent 2px, transparent 10px);
        }
        
        .card-container:nth-child(4) .card-front { background: linear-gradient(135deg, #5c7a8a 0%, #7ba3b8 100%); border-color: #ffd700; }
        .card-container:nth-child(4) .card-front::before {
            content: '⭐';
            font-size: 100px;
            opacity: 0.15;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-container:nth-child(5) .card-front { background: linear-gradient(135deg, #a83232 0%, #d63447 100%); border-color: #c8e6c9; }
        .card-container:nth-child(5) .card-front::before {
            background-image: radial-gradient(circle, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 15px 15px;
        }
        
        .card-container:nth-child(6) .card-front { background: linear-gradient(135deg, #0f6841 0%, #16a168 100%); border-color: #f8e5d2; }
        .card-container:nth-child(6) .card-front::before {
            content: '🎄';
            font-size: 90px;
            opacity: 0.12;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card-container:nth-child(7) .card-front { background: linear-gradient(135deg, #7e3b5f 0%, #a84d7b 100%); border-color: #ffd700; }
        .card-container:nth-child(8) .card-front { background: linear-gradient(135deg, #4a7c8f 0%, #6ba5ba 100%); border-color: #ff8787; }
        .card-container:nth-child(9) .card-front { background: linear-gradient(135deg, #b42d3b 0%, #d63447 100%); border-color: #90d5ff; }
        .card-container:nth-child(10) .card-front { background: linear-gradient(135deg, #0e5c3c 0%, #168f5f 100%); border-color: #ffd700; }
        .card-container:nth-child(11) .card-front { background: linear-gradient(135deg, #903555 0%, #c4486d 100%); border-color: #c8e6c9; }
        .card-container:nth-child(12) .card-front { background: linear-gradient(135deg, #91222c 0%, #c92a2a 100%); border-color: #90d5ff; }
        
        .card-container:nth-child(13) .card-front { background: linear-gradient(135deg, #5a8596 0%, #7cb4c9 100%); border-color: #ffd700; }
        .card-container:nth-child(14) .card-front { background: linear-gradient(135deg, #0d6845 0%, #17a168 100%); border-color: #f8e5d2; }
        .card-container:nth-child(15) .card-front { background: linear-gradient(135deg, #8b2d4a 0%, #b8385e 100%); border-color: #90d5ff; }
        .card-container:nth-child(16) .card-front { background: linear-gradient(135deg, #a73030 0%, #d63447 100%); border-color: #c8e6c9; }
        .card-container:nth-child(17) .card-front { background: linear-gradient(135deg, #116a48 0%, #1a9d6a 100%); border-color: #ffd700; }
        .card-container:nth-child(18) .card-front { background: linear-gradient(135deg, #7d3961 0%, #a84d7b 100%); border-color: #ff8787; }
        
        .card-container:nth-child(19) .card-front { background: linear-gradient(135deg, #4e7a8c 0%, #6fa4b8 100%); border-color: #ffd700; }
        .card-container:nth-child(20) .card-front { background: linear-gradient(135deg, #991f2d 0%, #c92a2a 100%); border-color: #90d5ff; }
        .card-container:nth-child(21) .card-front { background: linear-gradient(135deg, #0c5e3f 0%, #14875a 100%); border-color: #f8e5d2; }
        .card-container:nth-child(22) .card-front { background: linear-gradient(135deg, #893657 0%, #b8385e 100%); border-color: #c8e6c9; }
        .card-container:nth-child(23) .card-front { background: linear-gradient(135deg, #b02e3a 0%, #d63447 100%); border-color: #ffd700; }
        .card-container:nth-child(24) .card-front { background: linear-gradient(135deg, #0f6744 0%, #17a168 100%); border-color: #ff8787; }
        
        .emoji {
            font-size: 3em;
            margin-bottom: 8px;
            filter: drop-shadow(3px 3px 5px rgba(0,0,0,0.4));
            position: relative;
            z-index: 1;
        }
        
        .day-number {
            font-size: 3.5em;
            font-weight: bold;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            font-family: 'Georgia', serif;
        }
        
        .day-text {
            font-size: 0.55em;
            margin-top: 2px;
            opacity: 0.95;
            position: relative;
            z-index: 1;
            font-style: italic;
        }
        
        .card-back {
            background: #ffffff;
            background-color: #ffffff;
            transform: rotateY(180deg);
            border: 4px solid #8b3a3a;
            padding: 12px;
            justify-content: space-between;
            z-index: 10;
        }
        
        .card-back h3 {
            color: #8b3a3a;
            font-size: 1em;
            margin: 0 0 5px 0;
            line-height: 1.15;
            font-weight: 700;
        }
        
        .card-back p {
            font-size: 0.72em;
            margin: 0;
            line-height: 1.2;
            color: #555;
            flex-grow: 1;
        }
        
        .card-back a {
            display: block;
            padding: 7px 12px;
            background: linear-gradient(135deg, #c92a2a 0%, #8b1e1e 100%);
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 0.75em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(139, 30, 30, 0.3);
            margin-top: 8px;
        }
        
        .card-back a:hover {
            background: linear-gradient(135deg, #ffd700 0%, #ffa502 100%);
            color: #333;
            transform: scale(1.08);
            box-shadow: 0 6px 15px rgba(255, 215, 0, 0.5);
        }
        
        @media (max-width: 1100px) {
            .calendar-grid {
                grid-template-columns: repeat(4, 150px);
                gap: 12px;
            }
            .card-container {
                height: 150px;
            }
            h1 {
                font-size: 2.8em;
            }
        }
        
        @media (max-width: 700px) {
            .calendar-grid {
                grid-template-columns: repeat(3, 120px);
                gap: 10px;
            }
            .card-container {
                height: 120px;
            }
            h1 {
                font-size: 2.2em;
            }
            .subtitle {
                font-size: 1em;
            }
            .emoji {
                font-size: 2.2em;
            }
            .day-number {
                font-size: 2.8em;
            }
        }
        
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            color: #8b3a3a;
            font-weight: 500;
        }
        
        footer a {
            color: #c92a2a;
            text-decoration: none;
            font-weight: bold;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>✨ Calendrier de Décembre Numérique ✨</h1>
        <p class="subtitle">Une surprise numérique tous les jours. Rendez-vous le 1er décembre !</p>
    </div>

    <div id="calendarGrid" class="calendar-grid">
        <!-- Les cartes seront générées par JavaScript -->
    </div>

    <footer>
        <p>
            Conçu par <strong><a href="/cdn-cgi/l/email-protection#8eefe3ebe2e7eba0fde7e2f8ebfcfacefcebe9e7e1e0a3efedefeaebe3e7fffbeba3e6eae8a0e8fc">Amélie Silvert</a></strong> à l'aide de l'IA
        </p>
    </footer>

    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        const calendarData = [
            { day: 1, title: 'Nuage', desc: 'Stockage et partage sécurisé', url: 'https://nuage.apps.education.fr', emoji: '☁️' },
            { day: 2, title: 'Tchap', desc: 'Messagerie sécurisée', url: 'https://www.tchap.gouv.fr/', emoji: '💬' },
            { day: 3, title: 'Visio Agents', desc: 'Visioconférence', url: 'https://portail.apps.education.fr/services/visio-agents', emoji: '📹' },
            { day: 4, title: 'Fichiers (DINUM)', desc: 'Envoi de fichiers', url: 'https://fichiers.numerique.gouv.fr', emoji: '📤' },
            { day: 5, title: 'FranceTransfert', desc: 'Transfert de documents', url: 'https://francetransfert.numerique.gouv.fr/upload', emoji: '📦' },
            { day: 6, title: 'CodiMD', desc: 'Éditeur collaboratif', url: 'https://portail.apps.education.fr/services/pad-avance-codimd', emoji: '✍️' },
            { day: 7, title: 'Tribu', desc: 'Espace de travail commun', url: 'https://tribu.phm.education.gouv.fr/', emoji: '🏕️' },
            { day: 8, title: 'Portail Tubes', desc: 'Hébergement vidéo', url: 'https://portail.apps.education.fr/services/portail-tubes', emoji: '📺' },
            { day: 9, title: 'PodEduc', desc: 'Création de podcasts', url: 'https://podeduc.apps.education.fr/', emoji: '🎙️' },
            { day: 10, title: 'Questionnaire', desc: 'Recueil de réponses', url: 'https://questionnaire.apps.education.fr', emoji: '✅' },
            { day: 11, title: 'Sondage', desc: 'Vote en ligne', url: 'https://sondage.apps.education.fr/', emoji: '📊' },
            { day: 12, title: 'Éléa', desc: 'Plateforme pédagogique', url: 'https://dane.site.ac-lille.fr/2024/09/20/simplifiez-votre-enseignement-avec-elea/', emoji: '💻' },
            { day: 13, title: 'Scratch', desc: 'Programmation créative', url: 'https://scratch.mit.edu/', emoji: '🎮' },
            { day: 14, title: 'OpenBoard', desc: 'Tableau numérique', url: 'https://openboard.ch/', emoji: '📝' },
            { day: 15, title: 'Édugéo', desc: 'Cartographie', url: 'https://www.edugeo.fr/', emoji: '🗺️' },
            { day: 16, title: 'Générateur Cartes', desc: 'Création de cartes mentales', url: 'http://generateur-cartes-pdf.tapeps.fr', emoji: '🃏' },
            { day: 17, title: 'LearningApps', desc: 'Activités interactives', url: 'https://learningapps.org/', emoji: '🧩' },
            { day: 18, title: 'Lumni', desc: 'Contenus éducatifs', url: 'https://www.lumni.fr/', emoji: '🎓' },
            { day: 19, title: 'Marble', desc: 'Globe numérique', url: 'https://marble.kde.org/', emoji: '🌍' },
            { day: 20, title: 'Capytale', desc: 'Activités interactives', url: 'https://capytale2.ac-paris.fr', emoji: '⌨️' },
            { day: 21, title: 'Les Pépites', desc: 'Chatbot pédagogique', url: 'https://docs.forge.apps.education.fr/pepites/', emoji: '🤖' },
            { day: 22, title: 'Labo IA Didaklab', desc: 'Expérimentation IA', url: 'https://novapeda.eu/didaklab', emoji: '🔬' },
            { day: 23, title: 'Shotcut', desc: 'Montage vidéo', url: 'https://shotcut.org/', emoji: '🎬' },
            { day: 24, title: 'Tournesol', desc: 'Évaluation IA', url: 'https://tournesol.app/', emoji: '🌻' }
        ];

        function createCard(card) {
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentDay = now.getDate();
            
            let isUnlocked = false;
            let isToday = false;
            
            if (currentMonth === 11 && currentDay >= card.day) {
                isUnlocked = true;
                if (currentDay === card.day) {
                    isToday = true;
                }
            }
            else if (currentMonth > 11) {
                isUnlocked = true;
            }
            
            const lockedClass = isUnlocked ? '' : 'locked';
            const todayClass = isToday ? 'today' : '';
            const onclickAttr = isUnlocked ? 'onclick="flipCard(this)"' : '';
            
            return `
                <div class="card-container ${lockedClass} ${todayClass}" ${onclickAttr}>
                    <div class="locked-overlay">
                        <div class="locked-icon">🔒</div>
                        <div class="locked-text">RDV le ${card.day} déc.</div>
                    </div>
                    <div class="data-card">
                        <div class="card-front">
                            <div class="emoji">${card.emoji}</div>
                            <div class="day-number">${card.day}</div>
                            <div class="day-text">Décembre</div>
                        </div>
                        <div class="card-back">
                            <h3>${card.title}</h3>
                            <p>${card.desc}</p>
                            <a href="${card.url}" target="_blank" onclick="event.stopPropagation()">Accéder</a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCards() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = calendarData.map(card => createCard(card)).join('');
        }

        function flipCard(container) {
            container.classList.toggle('flipped');
        }

        renderCards();
    </script>

</body>
</html>

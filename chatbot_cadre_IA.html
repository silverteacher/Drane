<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot IA Éducation - Cadre d'Usage 2025</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: none;
      color: #333333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f6f8;
    }
    .chat-container {
      width: 100%;
      max-width: 600px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      background: #ffffff;
      overflow: hidden;
    }
    header {
      background: linear-gradient(90deg, #2b5876, #4e4376); /* bleu-violet moderne */
      padding: 1em 1.5em;
      color: white;
      font-size: 1.5em;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 1em;
    }
    header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: white;
      padding: 4px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 1em;
      background: #eef2f7;
      display: flex;
      flex-direction: column;
      gap: 1em;
    }
    .message {
      display: flex;
      gap: 0.8em;
      max-width: 80%;
    }
    .message.bot {
      flex-direction: row;
    }
    .message.user {
      flex-direction: row-reverse;
      margin-left: auto;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 1.2em;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .chat-bubble {
      background: white;
      padding: 0.8em 1.2em;
      border-radius: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      white-space: pre-wrap;
      font-size: 1em;
      line-height: 1.4em;
    }
    .message.user .chat-bubble {
      background: #4e4376;
      color: white;
    }
    form {
      display: flex;
      gap: 0.5em;
      padding: 1em;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.8em 1em;
      border-radius: 20px;
      border: 1px solid #ccc;
      font-size: 1em;
      outline: none;
      transition: border-color 0.3s ease;
    }
    input[type="text"]:focus {
      border-color: #4e4376;
    }
    button {
      background: #4e4376;
      border: none;
      color: white;
      padding: 0 1.5em;
      border-radius: 20px;
      cursor: pointer;
      font-size: 1em;
      transition: background 0.3s ease;
    }
    button:hover {
      background: #2b5876;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header>
      <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Chatbot" />
      Cadre d'usage de l'IA - Chatbot Éducation 2025
    </header>
    <div class="messages" id="messages">
      <div class="message bot">
        <div class="avatar">
          <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Chatbot" />
        </div>
        <div class="chat-bubble">
          Bonjour ! Je suis Chatbot, votre assistant dédié au cadre d’usage de l’IA dans l’éducation française. Posez-moi vos questions pour adopter et respecter les bonnes pratiques de l’IA à l’école.
        </div>
      </div>
    </div>
    <form id="chat-form">
      <input type="text" id="user-input" autocomplete="off" placeholder="Tapez votre question ici..." required />
      <button type="submit">Envoyer</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const messages = document.getElementById('messages');

    function appendMessage(content, sender = 'bot') {
      const messageElem = document.createElement('div');
      messageElem.classList.add('message', sender);

      const avatarDiv = document.createElement('div');
      avatarDiv.classList.add('avatar');
      if (sender === 'bot') {
        const avatarImg = document.createElement('img');
        avatarImg.src = "https://cdn-icons-png.flaticon.com/512/2991/2991148.png";
        avatarImg.alt = "Chatbot";
        avatarDiv.appendChild(avatarImg);
      } else {
        avatarDiv.textContent = "Vous";
      }

      const bubble = document.createElement('div');
      bubble.classList.add('chat-bubble');
      bubble.textContent = content;

      messageElem.appendChild(avatarDiv);
      messageElem.appendChild(bubble);
      messages.appendChild(messageElem);
      messages.scrollTop = messages.scrollHeight;
    }

    // Réponses enrichies, suggestions allégées
    function generateResponse(inputText) {
      const text = inputText.toLowerCase();
      if (text.includes('principe') || text.includes('valeurs')) {
        return "Les usages de l’IA doivent respecter les valeurs de l’École de la République : équité, inclusion, liberté pédagogique, et toujours sous contrôle humain. La responsabilité et la transparence priment dans chaque usage.";
      } else if (text.includes('rgpd') || text.includes('données')) {
        return "Le RGPD impose de ne jamais saisir de données personnelles ou confidentielles dans les IA publiques utilisées à l’école. L’utilisation de l’IA doit toujours être annoncée aux personnes concernées.";
      } else if (text.includes('usage')) {
        return "En primaire, l’accent est mis sur la découverte des concepts d’IA. Dès la 4e, les élèves peuvent manipuler des IA génératives en classe avec l’accompagnement d’un enseignant. Au lycée, l’autonomie est encouragée dans un cadre pédagogique explicite.";
      } else if (text.includes('évaluation') || text.includes('devoir')) {
        return "Réaliser un devoir entièrement avec l’aide d’une IA, sans autorisation ou appropriation personnelle, est interdit et assimilé à une fraude. Les évaluations valorisent avant tout le raisonnement personnel des élèves.";
      } else if (text.includes('environnement') || text.includes('impact')) {
        return "Il est essentiel d’utiliser l’IA de façon raisonnée : privilégier une utilisation frugale pour limiter l’empreinte écologique, et préférer des solutions libres et sobres lorsque possible.";
      } else if (text.includes('suggestion') || text.includes('conseil')) {
        return "Retenez : ne saisissez jamais de données personnelles, annoncez toute utilisation d’IA et privilégiez toujours le contrôle humain et l’esprit critique dans vos usages.";
      } else {
        return "Je suis désolé, je n’ai pas compris votre question. Posez-moi une question sur l’IA à l’école : principes, données, usages, environnement, ou évaluations.";
      }
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const userText = input.value.trim();
      if (!userText) return;

      appendMessage(userText, 'user');
      input.value = '';

      setTimeout(() => {
        const response = generateResponse(userText);
        appendMessage(response, 'bot');
      }, 500);
    });
  </script>
</body>
</html>

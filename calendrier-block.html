<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier de l'Avent Numérique</title>
    <!-- Masque le warning Tailwind CDN -->
    <script>
        window.process = { env: { NODE_ENV: 'production' } };
    </script>
    <!-- Chargement de Tailwind CSS pour un style moderne et light -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Configuration de la police Inter (recommandée par défaut avec Tailwind) */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image: url('https://cdn.pixabay.com/photo/2018/09/21/14/01/snowflakes-3693171_1280.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #f9fafb;
        }

        /* Styles spécifiques pour la carte à retourner (flip) */
        .card-container {
            perspective: 1000px;
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer; 
        }
        
        /* Désactive le survol/transformation pour les cartes inactives */
        .card-container:hover {
             transform: translateY(-5px) rotate(1deg);
        }
        .card-container.inactive-card:hover {
             transform: none; /* Annule la transformation au survol */
        }
        .card-container.inactive-card {
            opacity: 0.4; /* Opacité réduite pour les jours non débloqués */
            cursor: default; /* Curseur par défaut */
            filter: grayscale(100%); /* Optionnel : pour renforcer l'idée que c'est "fermé" */
        }

        .data-card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            transform-style: preserve-3d;
        }

        .card-container.flipped .data-card {
            transform: rotateY(180deg);
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 1rem; 
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: space-between; 
            padding: 1.5rem; 
        }
        
        /* Correction du débordement du bouton sur la face arrière */
        .card-back a {
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        /* --- STYLES PATCHWORK (Tailles et Espacement) --- */

        /* Ajustements pour les cartes 1x1, 2x1, 1x2 */
        .card-container.h-44 .text-5xl,
        .card-container.h-80 .text-5xl {
            font-size: 3.5rem; /* Taille du jour sur les cartes plus petites */
        }
        .card-container.h-44 .text-2xl {
             font-size: 1.25rem; /* Taille de "JOUR" sur les petites cartes */
        }

        /* Spécifique pour les cartes 2x2 (grande tuile) */
        .card-container.col-span-2.row-span-2 .text-6xl {
            font-size: 5rem; /* Jour sur les grandes cartes */
        }
        .card-container.col-span-2.row-span-2 .text-3xl {
            font-size: 2.5rem; /* "JOUR" sur les grandes cartes */
        }


        /* Ajustement du gap de la grille */
        .grid-patchwork {
            gap: 1.5rem; /* Augmente l'espace entre les tuiles */
        }
        
        /* Responsive mobile */
        @media (max-width: 768px) {
            .grid-patchwork {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 0.75rem !important;
            }
            
            /* FORCE toutes les cartes en 1x1 sur mobile/tablette */
            .card-container {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
                height: 180px !important;
            }
            
            .card-front, .card-back {
                padding: 0.75rem;
            }
            
            /* Tailles de texte face AVANT */
            .card-front .text-2xl,
            .card-front .text-3xl {
                font-size: 0.875rem !important;
                margin-bottom: 0.25rem !important;
            }
            
            .card-front .text-5xl,
            .card-front .text-6xl {
                font-size: 2.5rem !important;
            }
            
            /* Tailles de texte face ARRIERE */
            .card-back h3 {
                font-size: 0.9rem !important;
                margin-bottom: 0.5rem !important;
                line-height: 1.2 !important;
            }
            
            .card-back p {
                font-size: 0.7rem !important;
                margin-bottom: 0.5rem !important;
                line-height: 1.3 !important;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }
            
            .card-back a {
                font-size: 0.65rem !important;
                padding: 0.5rem 0.25rem !important;
                white-space: normal !important;
                line-height: 1.2 !important;
            }
            
            /* Header responsive */
            .header-bg-snow {
                padding: 1.5rem 1rem !important;
                border-radius: 0 0 1.5rem 1.5rem !important;
            }
            
            .header-bg-snow h1 {
                font-size: 1.5rem !important;
                line-height: 1.3 !important;
                margin-bottom: 0.5rem !important;
            }
            
            .header-bg-snow p:first-of-type {
                font-size: 0.9rem !important;
                line-height: 1.3 !important;
                margin-bottom: 0.25rem !important;
            }
            
            .header-bg-snow p:last-of-type {
                font-size: 0.85rem !important;
                margin-top: 0.5rem !important;
            }
            
            main {
                padding: 2rem 0.75rem !important;
            }
            
            footer {
                padding: 1rem 0.5rem !important;
                font-size: 0.75rem !important;
            }
        }
        
        /* Très petits écrans */
        @media (max-width: 400px) {
            .card-container {
                height: 160px !important;
            }
            
            .card-front .text-5xl,
            .card-front .text-6xl {
                font-size: 2rem !important;
            }
            
            .header-bg-snow h1 {
                font-size: 1.25rem !important;
            }
        }
        
        /* NOUVEAU STYLE HEADER pour fond de neige en transparence */
        .header-bg-snow {
            background-color: #1e3a8a;
            background-image: url('https://cdn.pixabay.com/photo/2018/09/21/14/01/snowflakes-3693171_1280.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            z-index: 0;
        }

        .header-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.5), rgba(220, 38, 38, 0.45));
            z-index: 1;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }
        
        /* Zone principale avec overlay blanc pour atténuer les flocons */
        main {
            position: relative;
            background-color: rgba(255, 255, 255, 0.92);
        }
        
        footer {
            background-color: rgba(255, 255, 255, 0.95);
        }
        
        /* Style pour la boîte de message temporaire */
        #messageBox {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f87171;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

        #messageBox.show {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- En-tête -->
    <header class="header-bg-snow text-white p-10 md:p-16 rounded-b-3xl shadow-2xl overflow-hidden">
        <div class="header-overlay"></div>
        <div class="max-w-7xl mx-auto text-center header-content">
            <h1 class="text-4xl md:text-6xl font-extrabold mb-2 tracking-tight text-white">
                Calendrier numérique de décembre
            </h1>
            <p class="text-2xl md:text-3xl font-light italic text-yellow-300 mb-2">
                Une surprise numérique par jour. Rendez-vous le 1er décembre !
            </p>
            <p class="text-lg md:text-xl font-light italic mt-2 text-white">
                Drane
            </p>
        </div>
    </header>

    <!-- Grille du Calendrier -->
    <main class="py-12 px-4">
        <div id="calendarGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6 md:gap-8 max-w-7xl mx-auto grid-flow-dense auto-rows-min grid-patchwork">
            <!-- Les cartes seront injectées ici par JavaScript -->
        </div>
    </main>
    
    <!-- Boîte de message temporaire -->
    <div id="messageBox" class="text-center font-bold"></div>

    <!-- Pied de page -->
    <footer class="text-center py-6 text-gray-600 text-sm border-t border-gray-200 mt-10">
        <p>
            Crédit original : <a href="mailto:amelie.silvert@ac-lille.fr" class="text-red-600 hover:text-red-800 transition-colors font-semibold hover:underline"><strong>Amélie Silvert</strong></a>
        </p>
    </footer>

    <script>
        // --- DONNÉES ET LOGIQUE DU CALENDRIER ---

        /**
         * Calcule le jour maximum déverrouillé.
         */
        function getUnlockedDay() {
            const today = new Date();
            const currentMonth = today.getMonth();
            
            if (currentMonth === 11 && today.getDate() >= 1 && today.getDate() <= 24) {
                return today.getDate();
            }
            
            return 0; 
        }

        const UNLOCKED_DAY = getUnlockedDay();
        
        let activeCard = null;

        // Données originales (dans l'ordre 1-24)
        const calendarData = [
            { day: 1, title: 'Nuage', desc: 'Stockage et partage sécurisé', url: 'https://nuage.apps.education.fr', emoji: '☁️' },
            { day: 2, title: 'Tchap', desc: 'Messagerie sécurisée', url: 'https://www.tchap.gouv.fr/', emoji: '💬' },
            { day: 3, title: 'Visio Agents', desc: 'Visioconférence', url: 'https://portail.apps.education.fr/services/visio-agents', emoji: '📹' },
            { day: 4, title: 'Fichiers (DINUM)', desc: 'Envoi de fichiers', url: 'https://fichiers.numerique.gouv.fr', emoji: '📤' },
            { day: 5, title: 'FranceTransfert', desc: 'Transfert de documents', url: 'https://francetransfert.numerique.gouv.fr/upload', emoji: '📦' },
            { day: 6, title: 'CodiMD', desc: 'Éditeur collaboratif', url: 'https://portail.apps.education.fr/services/pad-avance-codimd', emoji: '✍️' },
            { day: 7, title: 'Tribu', desc: 'Espace de travail commun', url: 'https://tribu.phm.education.gouv.fr/', emoji: '🏕️' },
            { day: 8, title: 'Portail Tubes', desc: 'Hébergement vidéo', url: 'https://portail.apps.education.fr/services/portail-tubes', emoji: '📺' },
            { day: 9, title: 'PodEduc', desc: 'Plateforme de vidéos et podcasts éducatifs', url: 'https://podeduc.apps.education.gouv.fr/', emoji: '🎙️' },
            { day: 10, title: 'Questionnaire', desc: 'Recueil de réponses', url: 'https://questionnaire.apps.education.fr', emoji: '✅' },
            { day: 11, title: 'Sondage', desc: 'Vote en ligne', url: 'https://sondage.apps.education.fr/', emoji: '📊' },
            { day: 12, title: 'Éléa', desc: 'Plateforme pédagogique', url: 'https://dane.site.ac-lille.fr/2024/09/20/simplifiez-votre-enseignement-avec-elea/', emoji: '💻' },
            { day: 13, title: 'Scratch', desc: 'Programmation créative', url: 'https://scratch.mit.edu/', emoji: '🎮' },
            { day: 14, title: 'OpenBoard', desc: 'Tableau numérique', url: 'https://openboard.ch/', emoji: '📝' },
            { day: 15, title: 'Édugéo', desc: 'Cartographie', url: 'https://www.edugeo.fr/', emoji: '🗺️' },
            { day: 16, title: 'Générateur Cartes', desc: 'Création de cartes mentales', url: 'http://generateur-cartes-pdf.tapeps.fr', emoji: '🃏' },
            { day: 17, title: 'LearningApps', desc: 'Activités interactives', url: 'https://learningapps.org/', emoji: '🧩' },
            { day: 18, title: 'Lumni', desc: 'Contenus éducatifs', url: 'https://www.lumni.fr/', emoji: '🎓' },
            { day: 19, title: 'Marble', desc: 'Globe numérique', url: 'https://marble.kde.org/', emoji: '🌍' },
            { day: 20, title: 'Capytale', desc: 'Activités interactives', url: 'https://capytale2.ac-paris.fr', emoji: '⌨️' },
            { day: 21, title: 'Les Pépites', desc: 'Chatbot pédagogique', url: 'https://docs.forge.apps.education.fr/pepites/', emoji: '🤖' },
            { day: 22, title: 'Labo IA Didaklab', desc: 'Expérimentation IA', url: 'https://novapeda.eu/didaklab', emoji: '🔬' },
            { day: 23, title: 'Shotcut', desc: 'Montage vidéo', url: 'https://shotcut.org/', emoji: '🎬' },
            { day: 24, title: 'Tournesol', desc: 'Évaluation IA', url: 'https://tournesol.app/', emoji: '🌻' }
        ];

        /** Palettes de couleurs */
        const colorPalettes = [
            { front: 'from-red-600 to-red-800', border: 'border-yellow-300', hover: 'hover:shadow-red-300', backColor: 'border-red-600' },
            { front: 'from-green-700 to-green-900', border: 'border-red-300', hover: 'hover:shadow-green-300', backColor: 'border-green-700' },
            { front: 'from-blue-700 to-blue-900', border: 'border-gray-300', hover: 'hover:shadow-blue-300', backColor: 'border-blue-700' },
            { front: 'from-pink-500 to-purple-600', border: 'border-cyan-300', hover: 'hover:shadow-pink-300', backColor: 'border-purple-600' },
            { front: 'from-orange-500 to-yellow-600', border: 'border-red-500', hover: 'hover:shadow-orange-300', backColor: 'border-orange-500' },
            { front: 'from-red-900 to-red-700', border: 'border-yellow-100', hover: 'hover:shadow-red-200', backColor: 'border-red-900' },
            { front: 'from-indigo-700 to-indigo-900', border: 'border-green-300', hover: 'hover:shadow-indigo-300', backColor: 'border-indigo-700' },
        ];
        
        const layoutClasses = [
            { grid: 'col-span-1 row-span-1', height: 'h-44', isLarge: false, isNarrow: false, isSquare: true },
            { grid: 'col-span-1 row-span-1', height: 'h-44', isLarge: false, isNarrow: false, isSquare: true },
            { grid: 'col-span-1 row-span-1', height: 'h-44', isLarge: false, isNarrow: false, isSquare: true },
            { grid: 'col-span-2 row-span-1', height: 'h-44', isLarge: false, isNarrow: false, isSquare: false },
            { grid: 'col-span-1 row-span-2', height: 'h-80', isLarge: true, isNarrow: true, isSquare: false },
            { grid: 'col-span-2 row-span-2', height: 'h-80', isLarge: true, isNarrow: false, isSquare: true },
        ];

        /**
         * Fonction pour mélanger un tableau (Algorithme de Fisher-Yates).
         */
        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [
                    array[randomIndex], array[currentIndex]
                ];
            }
            return array;
        }
        
        /** Affiche un message temporaire */
        function showMessage(text) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = text;
            msgBox.classList.add('show');
            
            setTimeout(() => {
                msgBox.classList.remove('show');
            }, 3000);
        }

        /**
         * Charge les données du calendrier (mélangées et persistantes)
         */
        function getPersistentCalendarData() {
            const storageKey = 'shuffledCalendarData';
            const storedData = localStorage.getItem(storageKey);
            
            if (storedData) {
                try {
                    const parsedData = JSON.parse(storedData);
                    if (parsedData.length === calendarData.length) {
                        return parsedData;
                    }
                } catch (e) {
                    console.error("Erreur de parsing des données stockées, mélange à nouveau.", e);
                }
            }

            let shuffled = shuffleArray([...calendarData]);
            
            try {
                localStorage.setItem(storageKey, JSON.stringify(shuffled));
                console.log("Nouvel ordre de cartes mélangé et sauvegardé dans localStorage.");
            } catch (e) {
                console.error("Impossible de sauvegarder dans localStorage.", e);
            }
            
            return shuffled;
        }

        const PERSISTENT_CALENDAR_DATA = getPersistentCalendarData();

        /**
         * Génère le HTML pour une carte du calendrier.
         */
        function createCard(card, index) {
            const day = card.day;
            const isUnlocked = day <= UNLOCKED_DAY;
            
            const palette = colorPalettes[index % colorPalettes.length];
            const bgClass = `bg-gradient-to-br ${palette.front} ${palette.border}`;
            const backBorder = `${palette.backColor} border-4`;

            const layoutIndex = index % layoutClasses.length;
            const layout = layoutClasses[layoutIndex];

            const gridClass = layout.grid;
            const heightClass = layout.height; 
            const isLargeSquare = gridClass.includes('col-span-2 row-span-2'); 
            const buttonText = isLargeSquare ? 'Accéder à la ressource' : 'Accéder';
            
            let statusClass = isUnlocked ? '' : 'inactive-card';
            let clickHandler = isUnlocked ? `flipCard(this)` : `showLockedMessage(${day})`;
            
            const frontContent = `
                <div class="text-2xl font-light mb-0.5 opacity-80 
                            ${isLargeSquare ? 'text-3xl mb-1' : 'text-2xl mb-0.5'}">
                    JOUR
                </div>
                <div class="font-black 
                            ${isLargeSquare ? 'text-6xl' : 'text-5xl'}">
                    ${day}
                </div>
            `;

            return `
                <div class="card-container ${gridClass} ${heightClass} ${statusClass}
                            hover:shadow-xl ${palette.hover} rounded-xl" 
                            data-day="${day}"
                            onclick="${clickHandler}">
                    
                    <div class="data-card">
                        
                        <!-- Face avant (RECTO) -->
                        <div class="card-front ${bgClass} text-white rounded-xl shadow-lg border-4">
                            ${frontContent}
                        </div>
                        
                        <!-- Face arrière (VERSO) -->
                        <div class="card-back bg-white text-gray-800 rounded-xl shadow-xl ${backBorder}">
                            
                            <!-- Titre et description -->
                            <div class="flex flex-col flex-grow relative z-10 w-full">
                                <h3 class="text-lg font-bold ${palette.backColor.replace('border-', 'text-')} mb-2">${card.title}</h3>
                                <p class="text-sm text-gray-600 mb-4 line-clamp-3 overflow-hidden">${card.desc}</p>
                            </div>
                            
                            <!-- Bouton -->
                            <a href="${card.url}" target="_blank" 
                               class="flex-shrink-0 w-full py-2 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition-colors text-xs uppercase tracking-wider mt-auto relative z-10"
                               onclick="event.stopPropagation()">
                                ${buttonText}
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }
        
        /** Affiche le message de carte verrouillée. */
        function showLockedMessage(day) {
            showMessage(`Patience ! La surprise du jour ${day} sera disponible le ${day} décembre.`);
        }

        /** Affiche toutes les cartes dans la grille */
        function renderCards() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = PERSISTENT_CALENDAR_DATA.map((card, index) => createCard(card, index)).join('');
        }

        /** Gère le retournement de la carte. */
        function flipCard(container) {
            if (container.classList.contains('inactive-card')) return;
            
            const isFlipped = container.classList.contains('flipped');

            if (activeCard && activeCard !== container) {
                activeCard.classList.remove('flipped');
                activeCard = null;
            }

            container.classList.toggle('flipped');
            
            if (container.classList.contains('flipped')) {
                activeCard = container;
            } else {
                activeCard = null;
            }
        }

        // Exécution du rendu
        renderCards();
    </script>
</body>
</html>
